# Render Blueprint. Create with: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets (GEMINI_API_KEY) are declared with sync:false, so Render asks for them and they are never stored in git.
services:
  - type: web
    name: brandguard-api
    runtime: python
    rootDir: backend
    plan: free            # OCR peaks at roughly 300-360 MB RAM in tests; the free tier's 512 MB is tight. Use a larger plan if you see restarts.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        sync: false       # set to your Vercel URL, e.g. https://brandguard-ai.vercel.app
      - key: FIREBASE_CREDENTIALS
        sync: false       # optional; leave empty for in-memory storage
      - key: OCR_MAX_SIDE
        value: "1280"
